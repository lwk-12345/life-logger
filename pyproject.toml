[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-logger"
version = "0.1.0"
description = "Local-first personal life event extraction from audio recordings"
readme = "README.md"
requires-python = ">=3.11"
# 【2026-11-05】依赖声明与代码对齐：core 只放 src/ 里**模块级** import 的包
# （现状：numpy —— audio_vad.py:13、speaker_registry.py:11）。
# 其余三方包在 src/ 里都是函数内延迟 import（缺了不影响服务启动），按能力分组进 extras。
# 真正被 import 的清单由 scripts/check_deps.py 扫描得出，tests/test_deps_declared.py 守着不漂移。
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# 本地 ASR 备选（moss_transcribe.py / audio_vad.py 函数内 import）
local-asr = ["faster-whisper>=1.1", "socksio>=1.0"]
# FunASR 家族：线上 worker 实际在跑（campplus_voiceprint.py:NN、moss_transcribe.py:NN 延迟 import）
asr = ["funasr>=1.3", "funasr-onnx>=0.4", "modelscope>=1.20", "soundfile>=0.14", "torch>=2.5"]
# 声纹模板（campplus_voiceprint.py 延迟 import）
voiceprint = ["sherpa-onnx>=1.13"]
# Apple 芯片本地转写（transcribe.py 延迟 import）
transcribe = ["mlx-whisper>=0.4"]
# 说话人分离 / 数值（speech_separation.py 延迟 import）
science = ["scipy>=1.13"]
jev = ["typesafe-sdk"]
# 环境声标注（audio_scene.py）走「独立 venv + subprocess」，与 MOSS / Kev 同手法：
# PANNs 需要 torch，绝不能装进 8765 的 worker venv。此组只给那个独立环境用。
# 注意：soundfile / panns_inference 的 import 写在 audio_scene.py:79-90 的
# `_WORKER = r'''...'''` 脚本文本里（由 subprocess 送给独立 venv 执行），
# 不是主模块的 import —— 所以主 venv 缺它们是正常的、也不会因此报错。
audio-scene = ["torch", "panns_inference", "soundfile"]
# 仅 scripts/asr_benchmark.py 用；qwen-asr 的包名未经核实，安装前请先确认。
asr-bench = ["qwen-asr"]

# uv 默认安装的依赖组：保证 `uv run pytest` 无需 --extra dev 即可直接用。
# （dev 曾只存在于 optional-dependencies，导致 `uv run pytest` 报
#   "Failed to spawn: pytest / No such file or directory"。）
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
life-logger = "life_logger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

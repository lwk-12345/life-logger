}

const catColor = c => { for (const [re, col] of CAT_COLORS) if (re.test(c || "")) return col; return "#848b97"; };
// 每笔单独列出：同额的两笔是两件事，不能按金额去重。
// 币种照实写，不知道就不写符号；单价保留单位（元/公斤、美元/月）。
function moneyText(it) {
  const symbol = {CNY: "¥", USD: "$"}[it.currency] ?? (it.currency ? `${it.currency} ` : "");
  const unit = String(it.unit || "");
  const rate = unit.includes("/") ? unit.slice(unit.indexOf("/")) : (/^[月周年天]$/.test(unit) ? `/${unit}` : "");
  const bare = !symbol && !rate && /^[元块]$/.test(unit) ? unit : "";
  return `${symbol}${it.amount}${bare}${rate}`;
}
const moneyOf = a => (a.items || []).filter(it => it.amount_kind === "money" && it.amount != null).map(moneyText);
const HIDE_STATUS = new Set(["", "未知", "unknown", "状态未知", "待确认"]);
// 行上只露出有信息量的状态；“已陈述/进行中”这类放到详情里。
const ROW_STATUS = new Set(["已完成", "计划", "已点单", "已请求", "已咨询", "已要求"]);
const cleanTitle = a => String(a.title_original || a.title || "活动记录").replace(/^(?:录音中疑似[：:]\s*|未确认[：:]\s*|录音中提及[：:]\s*)/, "");

function rowHtml(x) {
  const a = x.a, id = a.activity_id, isOpen = state.open.has(id);
  const money = moneyOf(a);
  const status = String(a.status || "");
  const notes = a.time_source === "occurred_non_self" ? ["时间来自旁人或视频"] : [];
  if (a.looks_like_fragment === true) notes.push("不确定是谁说的");
  const txList = (typeof state !== "undefined" && state && state.daily && state.daily.expense_ledger && state.daily.expense_ledger.payment_transactions) || [];
  const matchedTx = txList.filter(tx => tx && typeof tx === "object" && String(tx.event_id || "").split("#")[0] === String(id));
  const confirmedMoney = matchedTx.length
    ? matchedTx.map(tx => `¥${Number(tx.amount).toFixed(2)}`).join("、")
    : (a._confirmed_amount != null ? `¥${Number(a._confirmed_amount).toFixed(2)}` : "");
  const moneyHtml = confirmedMoney
    ? `<span class="money confirmed">已入账 ${esc(confirmedMoney)}</span>`
    : (money.length ? `<span class="money">提及 ${esc(money.join("、"))}</span>` : "");
  const tail = [moneyHtml, ROW_STATUS.has(status) ? esc(status) : ""].filter(Boolean).join(" · ");
  return `<li class="row" data-life="${x.life}" data-activity-id="${esc(id)}">
    <button type="button" data-toggle="${esc(id)}" aria-expanded="${isOpen}">
      <span class="r-clock tnum${x.basis === "spoken" ? " spoken" : ""}"${x.basis === "spoken" ? ' title="这是讲述时间，事情何时发生未说明"' : ""}>${x.minute != null ? fmt(x.minute) : "时间未定"}</span>
      <i class="dot" style="background:${x.life === "live" ? catColor(catOf(a)) : "#c5cad2"}" title="${esc(x.life === "live" ? catOf(a) : (x.life === "media" ? "媒体内容" : "待确认"))}"></i>
      <span class="r-title">${esc(cleanTitle(a))}${speechBadge(a)}${notes.length ? `<span class="r-note">${esc(notes.join(" · "))}</span>` : ""}</span>
      ${tail ? `<span class="r-tail">${tail}</span>` : "<span></span>"}
    </button>${isOpen ? detailHtml(x) : ""}</li>`;
}

const SPEECH_HIDE = new Set(["", "未知", "unknown", "未知对象"]);
const isUserCorrected = a => a.user_corrected === true || a.speech_target_source === "user_correction" || a.source === "user_correction" || a.correction_source === "user";
const APP_BUNDLES = {
  "com.yetone.alma": "Alma", "com.openai.codex": "Codex", "com.google.chrome": "Chrome", "com.tencent.xinwechat": "微信",
  "com.tencent.weworkmac": "企业微信", "com.apple.terminal": "Terminal", "com.microsoft.vscode": "VS Code", "com.apple.safari": "Safari",
  "com.tencent.qq": "QQ", "com.bytedance.feishu": "飞书", "com.apple.music": "音乐", "com.apple.notes": "备忘录", "md.obsidian": "Obsidian", "notion.id": "Notion",
};
function appFromBundle(bundle) {
  const raw = String(bundle || "").trim();
  if (!raw) return "";
  const hit = APP_BUNDLES[raw] || APP_BUNDLES[raw.toLowerCase()];
  if (hit) return hit;
  const tail = raw.split(".").filter(Boolean).pop() || "";
  return tail ? tail.charAt(0).toUpperCase() + tail.slice(1) : "";
}
function appFromContext(ctx) {
  if (!ctx || typeof ctx !== "object" || Array.isArray(ctx)) return null;
  const name = String(ctx.app_label || "").trim() || appFromBundle(ctx.target_bundle || ctx.target_app);
  return name ? {name, kind: ctx.kind} : null;
}
/** 说话时的应用：活动、子项、证据上都可能有，取第一个说得清的。 */
function resolveApp(a) {
  const target = String(a && a.speech_target || "").trim();
  const outdoorOrMerchant = ["商家/店员", "媒体内容", "旁人"].includes(target);
  const direct = appFromContext(a.input_context);
  if (direct && (!outdoorOrMerchant || direct.kind === "dictation")) return direct;
  const fg = a.foreground_context;
  if (!outdoorOrMerchant && fg && fg.status === "resolved") {
    const name = String(fg.foreground_app || "").trim() || appFromBundle(fg.foreground_bundle);
    if (name) return {name};
  }
  for (const it of a.items || []) {
    const viaItem = appFromContext(it && it.input_context);
    if (viaItem && (!outdoorOrMerchant || viaItem.kind === "dictation")) return viaItem;
    for (const ev of (it && it.evidence) || []) {
      const viaEv = appFromContext(ev && ev.input_context);
      if (viaEv && (!outdoorOrMerchant || viaEv.kind === "dictation")) return viaEv;
    }
  }
  return null;
}
function appBadge(a) {
  const app = resolveApp(a);
  if (!app) return "";
  const short = app.name.length > 18 ? `${app.name.slice(0, 18)}…` : app.name;
  const dictated = app.kind === "dictation";
  const tip = dictated ? "说话时正在用语音输入到这个应用" : "说话时最前面的应用，只是环境线索，不代表消息发给了它";
  return `<span class="badge app" title="${tip}">${dictated ? "语音输入到 " : ""}${esc(short)}</span>`;
}

function speechBadge(a) {
  const target = String(a.speech_target || "").trim();
  const corrected = isUserCorrected(a);
  const app = resolveApp(a);
  const showApp = app && (app.kind === "dictation" || CHAT_APPS.test(app.name));
  const dictated = showApp ? appBadge(a) : "";
  const sameAsApp = showApp && target.replace(/^对/, "") === app.name;
  return `${dictated}${SPEECH_HIDE.has(target) || sameAsApp ? "" : `<span class="badge">对${esc(target)}</span>`}${corrected ? `<span class="badge fixed" title="你纠正过这条">已纠正</span>` : ""}`;
}

function itemHtml(it) {
  const quotes = state.quotes ? (it.evidence || []).filter(e => e && e.quote).slice(0, 3) : [];
  const st = String(it.status || "");
  const money = it.amount_kind === "money" && it.amount != null;
  const other = it.amount != null && !money;
  return `<li>${esc(it.action || "")}${!HIDE_STATUS.has(st) && /[一-龥]/.test(st) ? `<span class="st">${esc(st)}</span>` : ""}${money ? `<span class="paid-note">提及 ${esc(moneyText(it))}（未确认付款）</span>` : ""}${other ? `<span class="paid-note">${esc(it.amount)}${esc(it.unit || "")}</span>` : ""}${quotes.map(q => `<blockquote>${esc(q.quote)}${q.speaker ? ` <small>· ${esc(q.speaker)}</small>` : ""}</blockquote>`).join("")}</li>`;
}

function detailHtml(x) {
  const a = x.a;
  const items = a.items || [];
  const mine = items.filter(it => (it.item_lifecycle || "live") === "live");
  const unknown = items.filter(it => it.item_lifecycle === "unknown");
  const media = items.filter(it => it.item_lifecycle === "media");
  const status = String(a.status || "");
  const unc = a.uncertainties || [];
  const fgApp = typeof resolveApp === "function" ? resolveApp(a) : null;
  return `<div class="detail">
    ${x.basis === "spoken" ? `<p class="r-note">这是讲述时间，事情何时发生未说明。</p>` : ""}
    ${fgApp && fgApp.kind !== "dictation" ? `<p class="r-note">当时前台应用：${esc(fgApp.name)}（只是环境线索，不代表消息发给了它）</p>` : ""}
    ${!HIDE_STATUS.has(status) && /[一-龥]/.test(status) ? `<p class="r-note">状态：${esc(status)}</p>` : ""}
    ${a.looks_like_fragment === true ? `<p class="r-note">${esc(a.fragment_reason || "不确定是谁说的")}</p>` : ""}
    ${a.summary ? `<p>${esc(a.summary)}</p>` : ""}
    ${mine.length ? `<h4>子项与原话（${mine.length}）</h4><ul>${mine.map(itemHtml).join("")}</ul>` : ""}
    ${unknown.length ? `<details class="others"><summary>${unknown.length} 条待确认是谁说的</summary><ul>${unknown.map(itemHtml).join("")}</ul></details>` : ""}
    ${media.length ? `<details class="others"><summary>${media.length} 条旁人或视频台词</summary><ul>${media.map(itemHtml).join("")}</ul></details>` : ""}
    ${unc.length ? `<h4>还不确定</h4><ul>${unc.map(u => `<li>${esc(typeof u === "string" ? u : (u.text || u.reason || JSON.stringify(u)))}</li>`).join("")}</ul>` : ""}
  </div>`;
}

const CARD_PREVIEW = 3;
const WORK_LABEL = "编程·工作";
const CODING_APPS = /^(alma|codex|claude|terminal|iterm|vs ?code|cursor|xcode|warp|ghostty|zed|openclaw|antigravity|windsurf)/i;
const CHAT_APPS = /^(微信|企业微信|qq|飞书|钉钉|telegram|whatsapp|imessage|信息|slack|wechat|wework)/i;
const FRAGMENT_TITLE = /零散|零碎|短句|短对话|交错对白|片段/;

function isChatTarget(a) {
  if (!a) return false;
  const app = resolveApp(a);
  if (app && CHAT_APPS.test(app.name)) return true;
  const target = String(a.speech_target || "").replace(/^对/, "").trim();
  return Boolean(target && (CHAT_APPS.test(target) || /(?:微信|企业微信|wechat)/i.test(target)));
}

function isFragmentNoise(a) {
  return Boolean(a && a.looks_like_fragment === true && !isChatTarget(a));
}

/** 展示用的分类：对微信等聊天软件说话始终算日常生活沟通（不归入编程·工作）；其次看已确认的工作·项目、说话时的应用与关键词表。 */
function catOf(a) {
  const hasPhysical = (a.items || []).some(it => it && (["expense", "food", "exercise", "smoke"].includes(it.fact_type) || (it.amount != null && it.amount_kind !== "weight" && it.amount_kind !== "quantity")));
  if (isChatTarget(a)) {
    const rawCat = a.category_model || a.category || "";
    if (rawCat && !["工作·项目", "编程·工作", "编程·项目优化", "生活·日常", "闲聊·其他"].includes(rawCat)) return rawCat;
    return "沟通";
  }
  if (a.lifecycle === "media") {
    if (a.category_model === "媒体内容" || a.category_model === "浏览·视频" || a.category_model === "看视频/媒体") return a.category_model;
    return a.category && !["工作·项目", "编程·工作", "编程·项目优化", "生活·日常", "闲聊·其他"].includes(a.category) ? a.category : "媒体内容";
  }
  if (a.category === "工作·项目" || a.category === "编程·项目优化" || a.category_model === "工作·项目" || a.category_model === "编程·工作") return WORK_LABEL;
  if (hasPhysical && (a.category_model || (a.category && a.category !== "生活·日常" && a.category !== "闲聊·其他"))) {
    return a.category_model || a.category;
  }
  const app = resolveApp(a);
  if (app && CODING_APPS.test(app.name)) return WORK_LABEL;
  if (!hasPhysical && app && app.kind === "dictation" && !CHAT_APPS.test(app.name)) return WORK_LABEL;
  if (CODING_APPS.test(String(a.speech_target || "").replace(/^对/, "").trim())) return WORK_LABEL;
  if (!hasPhysical && /(?:openclaw|codex|claude|alma|cursor|antigravity|airflow|suvid|mypi|collab|colab|github|api|网页端|终端|派单|代码|部署|子系统|提示词)/i.test(`${a.title || ""} ${a.title_original || ""} ${a.summary || ""}`)) return WORK_LABEL;
  if (a.category_model) return a.category_model === "工作·项目" ? WORK_LABEL : a.category_model;
  if (app && CHAT_APPS.test(app.name)) return "沟通";
  return a.category === "工作·项目" ? WORK_LABEL : a.category;
}

/** 对编程工具说的话和零碎短句默认折叠。对微信说话或说到钱的一律不折。 */
function foldReason(x) {
  const a = x.a;
  if (isChatTarget(a)) return "";
  if ((a.items || []).some(it => it.amount != null && it.amount_kind !== "weight" && it.amount_kind !== "quantity" || it.fact_type === "expense")) return "";
  if (catOf(a) === WORK_LABEL) return WORK_LABEL;
  if (a.fragment_money_protected === true) return "";
  // Only positive title/action/quote cues; summary negations such as 未到账 must not rescue 涨工资.
  const spending = /购买|买|支付|付款|消费|收款|到账|转账|多少钱|花钱|充值|订阅(?!量)|订单|下单|优惠券|代金券|运费|快递费|退款|退钱|现金|扫码|点餐|点单|点[一两二三四五六七八九十\d]+(?:个|份|碗|瓶|杯)|[¥￥$]|[零〇一二两三四五六七八九十百千万亿点\d.]+(?:元|块|美元|港币|欧元|日元|刀)/;
  const spendText = [a.title || "", ...(a.items || []).flatMap(it => [it.action || "", ...(it.evidence || []).map(e => e.quote || "")])].join(" ");
  if (spending.test(spendText) || spending.test(spendText.replace(/[^\p{L}\p{N}¥￥$]/gu, ""))) return "";
  if (a.looks_like_fragment === true) return "零碎片段";
  if (a.looks_like_fragment === false) return "";
  return FRAGMENT_TITLE.test(cleanTitle(a)) ? "零碎片段" : "";
}

/** 同一场景里按类别收成卡片，事情多时能一眼看出在做什么。卡片按首条时间排序，时间未定的排最后。 */
function hasMoney(a) {
  return a.fragment_money_protected === true
    || (a.items || []).some(it => it.amount != null && it.amount_kind !== "weight" && it.amount_kind !== "quantity" && (it.currency || it.fact_type === "expense"));
}

const DIGEST_KINDS = new Set(["fitness", "meal", "shopping", "outing", "other"]);

/** 接模型分类和汇总卡：只改展示。判成媒体的折进媒体，说到钱的不折，点开都能找回原文。 */
function applyDigest(D, digest) {
  if (!digest || digest.date !== D.date) return;
  const categories = digest.categories || {};
  const byId = new Map();
  for (const x of D.acts) {
    byId.set(x.a.activity_id, x);
    const c = categories[x.a.activity_id];
    if (!c) continue;
    x.a.category_model = (x.a.category === "工作·项目" || x.a.category === "编程·项目优化") && c.category_model === "闲聊·其他" ? "工作·项目" : c.category_model;
    x.a.category_reason = c.reason;
    if (c.looks_like_media === true && x.life !== "media" && !hasMoney(x.a)) x.life = "media";
  }
  for (const card of digest.cards || []) {
    if (!DIGEST_KINDS.has(card.kind)) continue;
    const members = (card.activity_ids || []).map(id => byId.get(id)).filter(x => x && x.life === "live" && x.minute != null && catOf(x.a) !== WORK_LABEL);
    if (members.length < 2 || members.some(x => x.digest)) continue;
    members.sort((p, q) => p.minute - q.minute);
    const view = {card, members, key: `digest-${members[0].a.activity_id}`};
    members.forEach((x, index) => { x.digest = view; x.digestLead = index === 0; });
  }
}

function digestTime(card, members) {
  const parts = iso => { const v = iso ? localParts(iso) : null; return v ? v.minute : null; };
  const from = parts(card.start) ?? members[0].minute, to = parts(card.end) ?? members[members.length - 1].minute;
  const range = from === to ? fmt(from) : `${fmt(from)}–${fmt(to)}`;
  const minutes = card.duration_minutes == null ? "" : ` · 约 ${Math.round(card.duration_minutes)} 分钟`;
  return `${range}${minutes}${card.time_basis === "spoken" ? "（按说话时间，不代表实际时长）" : ""}`;
}

/** 备注里的校验说明是给程序看的，只留“第二组”“几组”这种人话。 */
function digestNote(note) {
  return String(note || "").split(/[；;]/).map(part => part.trim())
    .filter(part => part && !/原话|完成状态|未说明|不填|completed|sets|reps|受阻|器械名称/i.test(part)).join("；");
}

function digestCardHtml(view) {
  const {card, members, key} = view;
  const open = state.expanded.has(key) || members.some(x => state.open.has(x.a.activity_id));
  const color = catColor(catOf(members[0].a));
  const details = (card.details || []).map(d => {
    const facts = [d.sets != null ? `${d.sets} 组` : "", d.reps != null ? `${d.reps} 次` : "", d.weight || "", digestNote(d.note)].filter(Boolean).join(" · ");
    return `<li><strong>${esc(d.name || "未说明")}</strong>${facts ? `<span>${esc(facts)}</span>` : ""}</li>`;
  }).join("");
  return `<article class="a-card digest" style="--card:${color}">
    <header class="a-card-head"><i class="dot" style="background:${color}"></i><strong>${esc(card.title)}</strong></header>
    <p class="digest-time tnum">${esc(digestTime(card, members))}</p>
    ${details ? `<ul class="digest-details">${details}</ul>` : ""}
    <button type="button" class="fold noise" data-expand="${esc(key)}" aria-expanded="${open}">原始记录 · ${members.length} 条</button>
    ${open ? `<ul class="rows">${members.map(rowHtml).join("")}</ul>` : ""}
  </article>`;
}

function groupCards(list) {
  const cards = new Map();
  for (const x of list) {
    const label = isFragmentNoise(x.a) ? "零碎片段" : (x.life === "media" ? "媒体内容" : (x.life === "unknown" ? "待确认" : String(catOf(x.a) || "其他")));
    if (!cards.has(label)) cards.set(label, {label, life: x.life, rows: []});
    cards.get(label).rows.push(x);
  }
  const first = card => { const m = card.rows.find(x => x.minute != null); return m ? m.minute : Infinity; };
  return [...cards.values()].sort((p, q) => first(p) - first(q));
}

function cardRange(rows) {
  const minutes = rows.map(x => x.minute).filter(m => m != null);
  if (!minutes.length) return "时间未定";
  const lo = Math.min(...minutes), hi = Math.max(...minutes);
  return lo === hi ? fmt(lo) : `${fmt(lo)}–${fmt(hi)}`;
}

function cardHtml(key, card) {
  const showAll = state.expanded.has(key) || card.rows.some(x => state.open.has(x.a.activity_id));
  const shown = showAll ? card.rows : card.rows.slice(0, CARD_PREVIEW);
  const color = card.life === "live" ? catColor(card.label) : "#c5cad2";
  const rest = card.rows.length - shown.length;
  if (card.rows.length === 1) return `<article class="a-card single" style="--card:${color}"><ul class="rows">${rowHtml(card.rows[0])}</ul></article>`;
  return `<article class="a-card" style="--card:${color}">
    <header class="a-card-head"><i class="dot" style="background:${color}"></i><strong>${esc(card.label)}</strong><span class="count tnum">${esc(cardRange(card.rows))} · ${card.rows.length} ${card.label === "零碎片段" ? "条" : "件"}</span></header>
    <ul class="rows">${shown.map(rowHtml).join("")}</ul>
    ${rest > 0 ? `<button type="button" class="fold" data-expand="${esc(key)}">再显示 ${rest} 件</button>` : ""}
  </article>`;
}

/** 场景是按声音粗合并的；已经有不少本人活动时，不能再说“无对话”。 */
function sceneLabel(label, list) {
  const live = list.filter(x => x.life === "live" && !isFragmentNoise(x.a)).length;
  return /无对话|安静少言/.test(String(label)) && live >= 3 ? "日常活动" : label;
}

function rowsBlock(key, list) {
  if (state.cleanLive) {
    let pool;
    if (state.filter === "live") {
      pool = list.filter(x => x.life === "live" && !isFragmentNoise(x.a) && foldReason(x) !== WORK_LABEL && catOf(x.a) !== WORK_LABEL);
    } else if (state.filter === "work") {
      pool = list.filter(x => x.life === "live" && (foldReason(x) === WORK_LABEL || catOf(x.a) === WORK_LABEL));
    } else if (state.filter === "media") {
      pool = list.filter(x => x.life === "media");
    } else if (state.filter === "unknown") {
      pool = list.filter(x => x.life === "unknown" || (x.life === "live" && isFragmentNoise(x.a)));
    } else {
      pool = list;
    }
    const filtered = state.cat ? pool.filter(x => catOf(x.a) === state.cat) : pool;
    if (!filtered.length) return "";
    const showDigests = state.filter === "live" && !state.cat;
    const main = showDigests ? filtered.filter(x => !x.digest) : filtered;
    const digests = showDigests ? filtered.filter(x => x.digestLead).map(x => digestCardHtml(x.digest)).join("") : "";
    return digests + groupCards(main).map((card, index) => cardHtml(`${key}-c${index}`, card)).join("");
  }
  const byLife = state.filter === "live" ? list.filter(x => x.life === "live" || x.a.looks_like_fragment === true) : (state.filter === "all" ? list : list.filter(x => x.life === state.filter));
  const filtered = state.cat ? byLife.filter(x => catOf(x.a) === state.cat) : byLife;
  // 在“我的生活”默认视图里才折叠；专门点某个分类或看“全部”时照常显示。
  const folding = state.filter === "live" && !state.cat;
  const folded = folding ? filtered.filter(x => foldReason(x)) : [];
  const main = folding ? filtered.filter(x => !foldReason(x) && !x.digest) : filtered;
  const digests = folding ? filtered.filter(x => x.digestLead && !foldReason(x)).map(x => digestCardHtml(x.digest)).join("") : "";
  const cardsForMain = groupCards(main);
  let out = digests + cardsForMain.map((card, index) => cardHtml(`${key}-c${index}`, card)).join("");
  const noise = state.filter === "live" ? list.filter(x => x.life !== "live" && x.a.looks_like_fragment !== true) : [];
  if (folded.length && noise.length) {
    const foldKey = `${key}-work-noise`, noiseKey = `${key}-noise`;
    const combined = [...folded, ...noise];
    const open = state.expanded.has(foldKey) || state.expanded.has(noiseKey) || combined.some(x => state.open.has(x.a.activity_id));
    const work = folded.filter(x => foldReason(x) === WORK_LABEL).length, bits = folded.length - work;
    const u = noise.filter(x => x.life === "unknown").length, m = noise.length - u;
    const summary = [
      work ? `${WORK_LABEL} · ${work} 条` : "",
      bits ? `零碎片段 · ${bits} 条` : "",
      m ? `看视频/媒体 · ${m} 条媒体内容` : "",
      u ? `${u} 条待确认` : "",
    ].filter(Boolean).join(" · ");
    out += `<button type="button" class="fold noise" data-expand="${esc(foldKey)}" aria-expanded="${open}">${summary}</button>`;
    if (open) out += groupCards(combined).map((card, index) => cardHtml(`${foldKey}-c${index}`, card)).join("");
  } else if (folded.length) {
    const foldKey = `${key}-work-noise`;
    const open = state.expanded.has(foldKey) || folded.some(x => state.open.has(x.a.activity_id));
    const work = folded.filter(x => foldReason(x) === WORK_LABEL).length, bits = folded.length - work;
    out += `<button type="button" class="fold noise" data-expand="${esc(foldKey)}" aria-expanded="${open}">${[work ? `${WORK_LABEL} · ${work} 条` : "", bits ? `零碎片段 · ${bits} 条` : ""].filter(Boolean).join(" · ")}</button>`;
    if (open) out += groupCards(folded).map((card, index) => cardHtml(`${foldKey}-c${index}`, card)).join("");
  } else if (noise.length) {
    // 媒体和待确认不占位置，折成一行；模型可能判错，所以点开还能看到。
    const u = noise.filter(x => x.life === "unknown").length, m = noise.length - u;
    const noiseKey = `${key}-noise`;
    const open = state.expanded.has(noiseKey) || noise.some(x => state.open.has(x.a.activity_id));
    out += `<button type="button" class="fold noise" data-expand="${esc(noiseKey)}" aria-expanded="${open}">${[m ? `看视频/媒体 · ${m} 条媒体内容` : "", u ? `${u} 条待确认` : ""].filter(Boolean).join(" · ")}</button>`;
    if (open) out += groupCards(noise).map((card, index) => cardHtml(`${noiseKey}-c${index}`, card)).join("");
  }
  return out;
}

/** 把一段区间裁到这一小时，返回小时内的百分比位置。 */
function hourSegments(ranges, hour) {
  const lo = hour * 60, hi = lo + 60;
  return ranges.map(r => ({...r, from: Math.max(r.from, lo), to: Math.min(r.to, hi)}))
    .filter(r => r.to > r.from)
    .map(r => ({...r, top: (r.from - lo) / 0.6, height: (r.to - r.from) / 0.6}));
}

/** 按小时排：录音、场景和事件左右对齐。连续没内容也没录音的小时折成一行，不留空白。 */
function hourBlocks(D, nowMin) {
  const placed = D.acts.filter(x => x.minute != null).slice();
  if (typeof state !== "undefined" && state && state.daily && state.daily.expense_ledger && typeof localParts === "function") {
    const actIds = new Set((D.acts || []).map(x => String(x.a && x.a.activity_id || "")));
    for (const tx of state.daily.expense_ledger.payment_transactions || []) {
      if (!tx || typeof tx !== "object" || tx.amount == null || !tx.time) continue;
      const baseId = String(tx.event_id || "").split("#")[0];
      if (baseId && actIds.has(baseId)) continue;
      const p = localParts(tx.time);
      if (!p || p.date !== D.date) continue;
      const title = (typeof cleanSpendName === "function" ? cleanSpendName(tx) : String(tx.item || tx.title || "")).trim() || "消费记录";
      placed.push({
        life: "live",
        minute: p.minute,
        basis: "occurred",
        a: {
          activity_id: String(tx.event_id || `tx-${p.minute}`),
          title,
          category: "餐饮·消费",
          status: "已完成",
          _confirmed_amount: tx.amount,
          items: [{
            action: title,
            amount: tx.amount,
            currency: tx.currency || "CNY",
            amount_kind: "money",
            fact_type: "expense",
            status: "已完成",
          }],
        },
      });
    }
  }
  const scenes = D.scenes.map(s => ({from: s.start_minute, to: s.end_minute, color: s.color, label: s.label, place: s.place}));
  const rec = D.rec.map(([from, to]) => ({from, to}));
  const lastHour = nowMin != null ? Math.floor(nowMin / 60)
    : Math.max(-1, ...placed.map(x => Math.floor(x.minute / 60)), ...rec.map(r => Math.floor((r.to - 1) / 60)));
  const blocks = [];
  for (let hour = 0; hour <= Math.min(23, lastHour); hour++) {
    const list = placed.filter(x => Math.min(23, Math.floor(x.minute / 60)) === hour).sort((p, q) => p.minute - q.minute);
    const recSegs = hourSegments(rec, hour), sceneSegs = hourSegments(scenes, hour);
    if (!list.length && !recSegs.length) {
      const last = blocks[blocks.length - 1];
      if (last && last.kind === "gap") last.to = hour + 1;
      else blocks.push({kind: "gap", from: hour, to: hour + 1});
      continue;
    }
    blocks.push({kind: "hour", hour, list, recSegs, sceneSegs});
  }
  return blocks;
}

function hourLabel(block) {
  const own = a123OwnHourLabel(block);
  if (own) return esc(own);
  const longest = [...(block.sceneSegs || [])].sort((p, q) => q.height - p.height)[0];
  // 只占这一小时一点点的场景不代表这一小时。
  if (!longest || longest.height < 25) return "";
  const labelText = sceneLabel(longest.label, block.list);
  const place = PLACE_TEXT[longest.place];
  const hidePlace = place === "在家" && /外出|采购|通勤|路上|店|健身|运动/.test(String(labelText));
  return `${esc(labelText)}${place && !hidePlace ? ` · ${place}` : ""}`;
}

function a123OwnHourLabel(block) {
  const totals = new Map(), seen = new Set();
  const names = {work: "工作·项目 / 助手沟通", shopping: "采购 / 点餐", exercise: "运动 / 健身", life: "生活事项"};
  for (const x of (block && block.list) || []) {
    if (x.life !== "live") continue;
    const a = x.a || {}, items = a.items || [];
    for (const item of items) {
      const physical = ["expense", "food", "exercise", "smoke"].includes(item.fact_type);
      const work = !physical && catOf(a) === WORK_LABEL;
      const kind = work ? "work" : (["expense", "food"].includes(item.fact_type) ? "shopping" : item.fact_type === "exercise" ? "exercise" : "life");
      for (const e of item.evidence || []) {
        if (e.source_label !== "self" || !e.quote) continue;
        const key = e.source_id || e.quote;
        if (seen.has(key)) continue;
        seen.add(key);
        // Evidence-content weight, not an invented duration when occurrence time is unknown.
        const weight = Math.min(40, String(e.quote).replace(/\s/g, "").length);
        totals.set(kind, (totals.get(kind) || 0) + weight);
      }
    }
  }
  const ranked = [...totals].sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return "";
  const chosen = ranked.filter(([, score], i) => i === 0 || score >= ranked[0][1] * 0.25).slice(0, 2);
  return "本人内容：" + chosen.map(([kind]) => names[kind]).join("；");
}

function hourHtml(block, current) {
  const start = block.hour * 60;
  const track = (segs, cls, color) => segs.map(r => `<i class="${cls}" style="top:${r.top.toFixed(2)}%;height:${r.height.toFixed(2)}%${color ? `;background:${r.color}` : ""}" title="${esc(`${r.label ? `${r.label} ` : "有录音 "}${fmt(r.from)}–${fmt(r.to)}`)}"></i>`).join("");
  const body = rowsBlock(`h${block.hour}`, block.list);
  const hasMain = body.includes("<article");
  const sceneHead = !body ? `<div class="h-scene">${[hourLabel(block), !block.list.length ? "有录音 · 未整理出活动" : ""].filter(Boolean).join(" · ")}</div>` : "";
  return `<section class="hour${current ? " current" : ""}${hasMain ? "" : " quiet"}" data-start="${start}">
    <div class="h-time tnum">${pad(block.hour)}:00</div>
    <div class="h-track rec" title="左竖条：有录音时段" aria-hidden="true">${track(block.recSegs, "h-rec", false)}</div>
    <div class="h-track sc" title="右竖条：所属场景（颜色同上方图例）" aria-hidden="true">${track(block.sceneSegs, "h-sc", true)}</div>
    <div class="h-body">${sceneHead}${body}</div>
  </section>`;
}

function timelineHtml(D, nowMin) {
  const noTime = D.acts.filter(x => x.minute == null);
  const blocks = hourBlocks(D, nowMin);
  const hideEmptyHours = Boolean(state.cleanLive && state.filter !== "all");
  let html = "", used = 0, procDone = nowMin == null || D.procMin == null;
  for (const b of blocks) {
    if (b.kind === "gap") {
      if (!hideEmptyHours) html += `<div class="h-gap"><span class="tnum">${pad(b.from)}:00–${pad(b.to)}:00</span> 没有录音</div>`;
      continue;
    }
    used += b.list.filter(x => !x.a || !x.a._confirmed_amount).length;
    if (hideEmptyHours && !rowsBlock(`h${b.hour}`, b.list)) continue;
    html += hourHtml(b, nowMin != null && Math.floor(nowMin / 60) === b.hour);
    if (!procDone && D.procMin < (b.hour + 1) * 60) {
      procDone = true;
      html += cursorHtml("proc", D.procMin, "整理到这里", "之后的录音还在排队");
    }
  }
  if (nowMin != null && !hideEmptyHours) html += cursorHtml("now", nowMin, "现在", "后面的内容会随录音继续出现");
  if (noTime.length) {
    used += noTime.length;
    if (!hideEmptyHours || rowsBlock("none", noTime)) {
      html += sceneHtml("none", "时刻", "未知", null, "时刻未知", "#a3aab3", noTime, false, -1, true);
    }
  }
  if (!html && hideEmptyHours) {
    const filterLabel = (FILTERS.find(([k]) => k === state.filter) || [,"该分类"])[1];
    html = `<div class="state"><h2>这一天没有「${esc(filterLabel)}」记录</h2><p>对电脑说的话或媒体内容可在上方切换到「编程·工作」或「媒体内容」查看。</p></div>`;
  }
  return {html, used, total: D.acts.length};
}

const PLACE_TEXT = {Home: "在家", Office: "在公司", Transit: "在路上", Outside: "在外面"};

function sceneHtml(key, from, to, dur, label, color, list, current, startMin, quiet, place) {
  const placeTag = PLACE_TEXT[place] ? `<span class="place">${PLACE_TEXT[place]}</span>` : "";
  const live = list.filter(x => x.life === "live" && !x.a.looks_like_fragment).length;
  const body = rowsBlock(key, list);
  const count = list.length ? `${live ? `${live} 件我的生活` : ""}${live && list.length > live ? " · " : ""}${list.length > live ? `共 ${list.length} 条` : ""}` : "";
  return `<section class="scene${current ? " current" : ""}${quiet ? " quiet" : ""}" data-start="${startMin}" style="--dot:${color}">
    <div class="s-time tnum">${esc(from)}—${esc(to)}${dur != null ? `<small>${esc(fmtDur(dur))}</small>` : ""}</div>
    <div class="s-spine"><i></i></div>
    <div class="s-body"><div class="s-head"><h2>${esc(sceneLabel(label, list))}</h2>${placeTag}<span class="count">${esc(count)}</span></div>${body}</div></section>`;
}

function cursorHtml(kind, m, label, note) {
  return `<div class="cursor ${kind}"><div class="tnum">${fmt(m)}</div><div class="s-spine"></div><div><strong style="font-weight:500">${label}</strong> <span style="color:var(--muted);font-size:12px">${note}</span></div></div>`;
}

function noticesHtml(D) {
  const out = [];
  const off = D.offline;
  if (off && off.level && off.level !== "ok") {
    const hours = off.silent_hours != null ? Number(off.silent_hours).toFixed(1) : "?";
    out.push(`<p class="notice${off.level === "alert" ? " alert" : ""}" data-offline="${esc(off.level)}">手表已 ${hours} 小时未上报${off.last_seen_clock ? `（上次 ${esc(off.last_seen_clock)}）` : ""}。之后的空白不代表没发生事。</p>`);
  }
  // [2026-11-07 改版] “正在更新/重新统计”不再整行提示，改为概览右上角的“更新中”小标记（overviewHtml）。
  if (D.scenesPending) out.push(`<p class="notice">场景还在计算，暂时按时间排列，好了会自动更新。</p>`);
  if (D.errors.length) out.push(`<p class="notice" data-partial="${D.errors.length}">这一天有 ${D.errors.length} 段没有整理成功，这些时段可能缺内容。</p>`);
  const gap = state.gaps && state.gaps.days.find(r => r.date === D.date);
  if (gap && Number(gap.gap_count) > 0) {
    const ageH = (Date.now() - Date.parse(state.gaps.generated_at || "")) / 3600000;
    out.push(`<p class="notice" data-gap="${Number(gap.gap_count)}">本日有 ${Number(gap.gap_count)} 行没能整理，这些原话不在下面。${ageH > 12 ? "这份统计已超过 12 小时，仅作参考。" : ""}</p>`);
  }
  return out.join("");
}

function catsHtml(D) {
  let pool;
  if (state.cleanLive) {
    if (state.filter === "live") pool = D.acts.filter(x => x.life === "live" && !isFragmentNoise(x.a) && foldReason(x) !== WORK_LABEL && catOf(x.a) !== WORK_LABEL);
    else if (state.filter === "all") pool = D.acts;
    else return "";
  } else {
    pool = state.filter === "all" ? D.acts : D.acts.filter(x => x.life === state.filter);
  }
  const counts = new Map();
  pool.forEach(x => { const c = catOf(x.a); if (c) counts.set(c, (counts.get(c) || 0) + 1); });
  if (counts.size < 2) return "";
  return `<nav class="cats" aria-label="分类">${[...counts].sort((p, q) => q[1] - p[1]).map(([c, n]) => `<button type="button" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)} <span class="tnum">${n}</span></button>`).join("")}</nav>`;
}

function eventClock(ev) {
  const t = ev.time || {};
  return t.clock || (t.absolute ? (localParts(t.absolute) ? fmt(localParts(t.absolute).minute) : "") : "") || "时间未定";
}

function dailyField(daily, key) {
  return (daily && daily[key]) || (daily && daily.daily_summary && daily.daily_summary[key]);
}

function eventDomId(id) { return `event-${encodeURIComponent(String(id || ""))}`; }

// [2026-11-07 P2 唯一事实来源] 健身汇总：**只读后端 fitness_ledger.totals**，不在前端数 workouts。
function fitnessSummaryText(fitnessLedger) {
  const t = fitnessLedger && fitnessLedger.totals;
  if (!t || typeof t !== "object") return "";
  // 只显示**已知且非零**的量：后端的 set_count 目前恒为 0（明细里没填），
  // 把 0 当"已知的 0"展示会变成假精确——按本项目"没有已知值就不说"的规矩跳过。
  const bits = [];
  // [2026-11-07 P2] 训练次数优先用后端**去重后的会话数** session_count
  // （workout_count 是口述片段数：11-05 是 13 条片段 / 1 次训练）。
  const sessionCount = Number(t.session_count);
  const count = sessionCount > 0 ? sessionCount : Number(t.workout_count);
  if (count > 0) bits.push(`${count} 次训练`);
  if (Number(t.set_count) > 0) bits.push(`${Number(t.set_count)} 组`);
  if (Number(t.rep_total) > 0) bits.push(`${Number(t.rep_total)} 次`);
  if (Number(t.duration_seconds) > 0) bits.push(fmtDur(Number(t.duration_seconds) / 60));
  return bits.length ? `后端汇总：${bits.join(" · ")}` : "";
}

// 单条训练：优先用后端给的 set_count / rep_total / volume_kg（缺失才由调用方回退到逐条事实）。
function workoutBackendSummary(workout) {
  if (!workout || typeof workout !== "object") return "";
  const bits = [];
  // 同上：0 / null 都不展示（0 组、0 次不是"已知的量"，是明细没填）
  if (Number(workout.set_count) > 0) bits.push(`${Number(workout.set_count)} 组`);
  if (Number(workout.rep_total) > 0) bits.push(`${Number(workout.rep_total)} 次`);
  if (Number(workout.volume_kg) > 0) bits.push(`容量 ${Number(workout.volume_kg)} kg`);
  if (Number(workout.duration_seconds) > 0) bits.push(fmtDur(Number(workout.duration_seconds) / 60));
  if (!bits.length) return "";
  return bits.join(" · ") + (workout.volume_partial ? "（部分重量未知）" : "");
}

// 从后端 fitness_ledger.workouts 里找到这条事件对应的 workout（没有就返回 null → 走旧逻辑）
function workoutForEvent(ev) {
  const led = state.daily && state.daily.fitness_ledger;
  const list = led && Array.isArray(led.workouts) ? led.workouts : null;
  if (!list || !ev) return null;
  return list.find((w) => w && (w.event_id === ev.event_id || w.workout_id === ev.event_id)) || null;
}

function workoutTitle(ev, card) {
  if (!card || card.kind !== "fitness") return ev.title || "";
  const names = (card.facts || []).filter(f => /\.exercises\[\d+\]\.name$/.test(f.path || ""))
    .map(f => String(f.value || "").trim()).filter(v => v && !["未说明", "未知", "unknown", "力量训练"].includes(v));
  return names.length ? [...new Set(names)].join("、") : (card.title || ev.title || "");
}

function workoutFactsHtml(card, workout) {
  if (!card || card.kind !== "fitness") return "";
  const rows = (card.facts || []).filter(f => String(f.path || "").startsWith("data.exercise.")).map(f => {
    const set = String(f.path).match(/\.sets\[(\d+)\]/);
    const field = String(f.path).split(".").pop();
    const label = ({name: "动作", body_part: "部位", weight_kg: "重量", reps: "次数", set: "组次", duration_minutes: "时长"})[field] || "训练事实";
    const missing = f.value == null || f.value === "";
    const value = missing ? "未记录" : `${esc(f.value)}${f.unit ? ` ${esc(f.unit)}` : ""}`;
    const support = missing ? "" : (["model_only", "model_quote_only"].includes(f.support)
      ? '<span class="warn-note">模型概述 · 未逐字核实</span>'
      : f.support === "quote_verbatim" ? '<span class="group-note">逐字已证</span>'
      : '<span class="r-note">证据强度未说明</span>');
    const setNumber = set && (card.facts || []).find(other => other.path === String(f.path).replace(/\.[^.]+$/, ".set"));
    const setLabel = set ? (setNumber && setNumber.value != null ? `第 ${esc(setNumber.value)} 组` : `组记录 ${Number(set[1]) + 1}`) : "";
    return `<li>${setLabel ? `${setLabel} · ` : ""}${esc(label)}：${value} ${support}</li>`;
  });
  const time = card.time || {};
  const reported = localParts(time.reported_at || (card.evidence || {}).reported_at);
  const timing = card.retrospective || card.time_basis === "reported"
    ? `<p class="r-note">${card.retrospective ? "回顾 · " : ""}讲述时间 ${reported ? fmt(reported.minute) : "未定"}（UTC+8），发生时间未说明。</p>`
    : time.precision === "inferred" ? '<p class="warn-note">推断时间 · 未核实，不代表确定的发生时刻。</p>' : "";
  // [2026-11-07 P2] 后端给了这条 workout 的汇总就用它（不再让调用方从 facts 里数）
  const backend = (typeof workoutBackendSummary === "function") ? workoutBackendSummary(workout) : "";
  if (backend) rows.unshift(`<li data-workout-backend-summary>${esc(backend)}</li>`);
  return rows.length || timing ? `<div class="workout-facts" data-workout-facts>${timing}${rows.length ? `<ul>${rows.join("")}</ul>` : ""}</div>` : "";
}

function purchaseSummary(session, items) {
  return `同次购物 · ${items.map(it => `${esc(it.item || "未命名商品")}（${it.amount == null ? "金额未说" : `提及 ${esc(moneyText(it))}`}）`).join("、")} · 付款未确认`;
}

function eventRelationsHtml(ev, daily, events) {
  const presentation = dailyField(daily, "activity_presentation") || {};
  const byId = new Map(events.map(e => [e.event_id, e]));
  const targets = new Set(), notes = [];
  for (const group of presentation.groups || []) {
    if (!(group.member_event_ids || []).includes(ev.event_id)) continue;
    const basis = group.basis || {};
    let label = basis.label || "活动声明";
    if (basis.activity_entity_verified !== true && !label.includes("未核实")) label += " · 未核实";
    notes.push(`<span class="group-note">${esc(label)}</span>`);
    (group.member_event_ids || []).forEach(id => { if (id !== ev.event_id) targets.add(id); });
  }
  for (const edge of (dailyField(daily, "activity_links") || {}).edges || []) {
    if (["session", "recording", "order", "transaction", "receipt", "payment"].includes(String(edge.namespace || ""))) continue;
    if (edge.from_id !== ev.event_id && edge.to_id !== ev.event_id) continue;
    if (edge.activity_membership) notes.push('<span class="group-note">活动声明 · 未核实</span>');
    const target = edge.from_id === ev.event_id ? edge.to_id : edge.from_id;
    if (!edge.activity_membership || byId.has(target)) targets.add(target);
  }
  const links = [...targets].map(id => byId.has(id)
    ? `<button type="button" class="event-link" data-locate-event="${esc(id)}">定位 ${esc(byId.get(id).title || "关联记录")}</button>`
    : '<span class="r-note">目标不在本日</span>');
  return notes.length || links.length ? `<div class="event-relations">${[...new Set(notes)].join(" ")}${links.join(" ")}</div>` : "";
}

function eventHtml(ev, daily, events, decorate) {
  const card = (dailyField(daily, "activity_cards") || []).find(c => c.source_event_id === ev.event_id);
  const title = workoutTitle(ev, card);
  const unverifiedTitle = card && (card.facts || []).some(f => ["model_only", "model_quote_only"].includes(f.support) && f.value != null && String(title).includes(String(f.value)));
  return `<li id="${esc(eventDomId(ev.event_id))}" data-event-id="${esc(ev.event_id)}"><span class="tnum">${esc(eventClock(ev))}</span> <strong>${esc(title)}</strong>${title !== ev.title ? `<span class="r-note">（原：${esc(ev.title || "")}）</span>` : ""}${unverifiedTitle ? '<span class="warn-note">模型概述 · 未逐字核实</span>' : ""}${decorate ? decorate(ev) : ""}${workoutFactsHtml(card, (typeof workoutForEvent === "function") ? workoutForEvent(ev) : null)}${eventRelationsHtml(ev, daily, events)}</li>`;
}

function eventRowsHtml(events, daily, decorate) {
  const sessions = dailyField(daily, "purchase_sessions") || [];
  const handled = new Set();
  return events.map(ev => {
    if (handled.has(ev.event_id)) return "";
    const session = sessions.find(s => (s.member_ids || []).includes(ev.event_id));
    const members = session ? events.filter(e => (session.member_ids || []).includes(e.event_id)) : [];
    if (members.length < 2) { handled.add(ev.event_id); return eventHtml(ev, daily, events, decorate); }
    const items = (session.items || []).filter(it => members.some(e => e.event_id === it.event_id));
    members.forEach(e => handled.add(e.event_id));
    return `<li class="purchase-session" data-purchase-session="${esc(session.session_id)}"><details><summary>${purchaseSummary(session, items)}</summary><p class="r-note">同次购物的逐笔提及，支付是否完成未确认。</p><ul>${members.map(e => eventHtml(e, daily, events, decorate)).join("")}</ul></details></li>`;
  }).join("");
}

function captureRows(date, dashboard, events) {
  const visible = new Set(events.filter(e => {
    const p = localParts(e.time && e.time.absolute);
    return !p || p.date === date;
  }).map(e => e.event_id));
  const rows = [], seen = new Set();
  for (const [key, kind] of [["captured_todos", "待办线索"], ["captured_ideas", "想法线索"], ["captured_expenses", "消费线索"]]) {
    (dashboard[key] || []).forEach((c, index) => {
      const time = localParts(c.captured_at);
      if (time && time.date !== date) return;
      const ref = c.source_event_id || (c.capture_provenance || {}).source_event_id || (c.metadata || {}).source_event_id;
      if (ref && visible.has(ref)) return;
      const id = c.id || c.capture_id || `${key}-${index}`;
      const unique = JSON.stringify([key, id, c.captured_at, c.raw_text, c.extracted_content]);
      if (seen.has(unique)) return;
      seen.add(unique);
      rows.push({id, kind, c, clock: time ? fmt(time.minute) : "时间未定"});
    });
  }
  return rows;
}

function capturesHtml(D, events) {
  const rows = captureRows(D.date, D.captureSource || {}, events);
  if (!rows.length) return "";
  return `<section class="section" data-section="captures"><h3>即时抓取 · ${rows.length} 条</h3><p class="r-note">触发时刻（UTC+8），不是事情发生时刻；这些是未核实的线索。</p><ul class="capture-list">${rows.map(r => {
    const c = r.c, p = c.capture_provenance || {};
    const origin = c._origin === "event" ? "事件补充" : "录音触发抓取";
    const status = p.status === "resolved" ? "来源已定位" : p.status === "conflict" ? "来源有冲突" : "来源未定位";
    return `<li data-capture-id="${esc(r.id)}"><span class="tnum">${esc(r.clock)}</span> <span class="group-note">${esc(r.kind)} · 未核实</span><p>${esc(c.extracted_content || c.raw_text || "内容未提供")}</p>${state.quotes && c.raw_text ? `<blockquote>${esc(c.raw_text)}</blockquote>` : ""}<details><summary>抓取来源 · ${status}</summary><p>${origin}</p>${p.recording_id ? `<p>录音 ${esc(p.recording_id)}</p>` : ""}${p.segment_id ? `<p>片段 ${esc(p.segment_id)}</p>` : ""}</details></li>`;
  }).join("")}</ul></section>`;
}

function extrasHtml(D) {
  const parts = [];
  const daily = state.daily;
  if (daily && daily.expense_ledger && window.ExpenseDrilldown) {
    parts.push(`<section class="section" data-section="expense"><h3>消费</h3>${window.ExpenseDrilldown.build(daily.expense_ledger)}</section>`);
  } else if (state.dailyState === "failed") {
    parts.push(`<section class="section" data-section="expense"><h3>消费</h3><p class="r-note">消费明细没读取成功，不代表这天没有消费。</p></section>`);
  } else if (state.dailyState !== "ready") {
    parts.push(`<section class="section" data-section="expense"><h3>消费</h3><p class="r-note">正在读取消费明细。</p></section>`);
  }
  if (D.highlights) parts.push(`<section class="section" data-section="brief"><details><summary>当日简报</summary><p class="brief-lines">${esc(D.highlights)}</p></details></section>`);
  const summary = daily && daily.daily_summary;
  const events = (daily && daily.events) || [];
  if (events.length) {
    // [2026-11-04 F04] 默认只列本日；time.absolute 换算 UTC+8 后不是当天的算「跨日事件」，
    // 用户点开开关才显示，并在行尾标注它实际发生的日期与时刻。
    const sameDayEvents = [], crossDayEvents = [];
    // 全部按 UTC+8 判定。time.absolute 的 UTC 日期不能作依据：当天 00:00–08:00 的事件 UTC 日期是前一天。
    const eventParts = (ev) => {
      const abs = ev && ev.time && ev.time.absolute;
      if (!abs) return null;
      const local = localParts(abs);
      if (!local) return null;
      return {local, crossLocal: local.date !== D.date};
    };
    const isCrossDay = (ev) => {
      const p = eventParts(ev);
      return !!(p && p.crossLocal);
    };
    events.forEach(ev => { if (isCrossDay(ev)) crossDayEvents.push(ev); else sameDayEvents.push(ev); });
    // 开关只决定「显示不显示」，顺序一律沿用后端给的顺序，不把跨日条目挪到末尾。
    const shownEvents = state.crossDay ? events : events.filter(ev => !isCrossDay(ev));
    const crossDayMark = (ev) => {
      const p = eventParts(ev);
      if (!p) return "";
      if (p.crossLocal) return `<span class="group-note" data-crossday-date="local">（${+p.local.date.slice(5, 7)} 月 ${+p.local.date.slice(8, 10)} 日 ${fmt(p.local.minute)}）</span>`;
      return "";
    };
    const crossDayToggle = crossDayEvents.length
      ? `<nav class="cats" aria-label="跨日事件"><button type="button" data-crossday aria-pressed="${state.crossDay}">含跨日事件：${state.crossDay ? "开" : "关"}（${crossDayEvents.length} 条${state.crossDay ? "已列出" : "默认不列出"}）</button></nav>`
      : "";
    const conflicts = (dailyField(daily, "activity_presentation") || {}).conflicts || [];
    const conflicted = new Set();
    conflicts.forEach(c => (c.conflicted_event_ids || []).forEach(id => conflicted.add(id)));
    parts.push(`<section class="section" data-section="events">${crossDayToggle}<details><summary>正式事件 ${shownEvents.length} 条</summary><ul>${eventRowsHtml(shownEvents, daily, ev => `${crossDayMark(ev)}${conflicted.has(ev.event_id) ? '<span class="warn-note" data-conflict="1">相关记录不一致，已分别保留供核对</span>' : ""}`)}</ul></details></section>`);
  }
  if (D.unassociated.length) {
    parts.push(`<section class="section" data-section="unassociated"><details><summary>${D.unassociated.length} 条尚未归入活动</summary><ul>${D.unassociated.map(it => `<li>${esc(it.action || "")}${state.quotes && (it.evidence || [])[0] && it.evidence[0].quote ? `<small>${esc(it.evidence[0].quote)}</small>` : ""}</li>`).join("")}</ul></details></section>`);
  }
  parts.push(capturesHtml(D, events));
  return parts.join("");
}

function filterCounts(D) {
  const c = {live: 0, work: 0, media: 0, unknown: 0, all: (D && D.acts ? D.acts.length : 0)};
  for (const x of (D && D.acts) || []) {
    if (x.life === "media") c.media++;
    else if (x.life === "unknown" || isFragmentNoise(x.a)) c.unknown++;
    else if (foldReason(x) === WORK_LABEL || catOf(x.a) === WORK_LABEL) c.work++;
    else c.live++;
  }
  return c;
}

function render() {
  const D = state.data;
  if (D) applyDigest(D, state.digest);
  const isToday = D.date === shToday();
  const sh = new Date(Date.now() + TZ_MS).toISOString();
  const nowMin = isToday ? +sh.slice(11, 13) * 60 + +sh.slice(14, 16) : null;
  const counts = state.cleanLive ? filterCounts(D) : ((D.backend_counts && typeof activityCounts === "function")
    ? activityCounts(D)
    : (() => { const c = {all: D.acts.length, live: 0, unknown: 0, media: 0}; D.acts.forEach(x => c[x.life]++); return c; })());
  let body;
  let integrity = "";
  if (!D.acts.length && !D.scenes.length && captureRows(D.date, D.captureSource || {}, (state.daily && state.daily.events) || []).length) {
    body = '<div class="state"><h2>这天有即时抓取线索</h2><p>尚未整理出活动，抓取内容见下方。</p></div>';
  } else if (!D.acts.length && !D.scenes.length) {
    body = D.status === "ready" ? `<div class="state"><h2>${D.date === shToday() ? "今天还没有活动" : "这天没有记录"}</h2><p>${D.date === shToday() ? "录音上传和整理需要时间，出门在外时可能要晚几个小时。" : "这一天没有整理出任何活动。"}</p></div>`
      : `<div class="state"><h2>这一天还在整理</h2><p>整理完成后会出现在这里。</p></div>`;
  } else {
    const t = timelineHtml(D, nowMin);
    body = t.html;
    integrity = `已展示范围覆盖 ${t.used} / ${t.total} 条活动`;
  }
  const notice = noticesHtml(D);
  app.innerHTML = `${mast(D.date)}${clocksHtml(D, nowMin)}${notice}${ribbonHtml(D, nowMin)}
    <nav class="filters" aria-label="筛选">${FILTERS.map(([k, l]) => `<button type="button" data-filter="${k}" aria-pressed="${state.filter === k}">${l}<span class="tnum">${counts[k]}</span></button>`).join("")}</nav>
    ${catsHtml(D)}
    <div id="flow">${body}</div>
    ${extrasHtml(D)}
    <div class="tools"><button type="button" data-quotes="1">${state.quotes ? "隐藏原话" : "显示原话"}</button><button type="button" data-refresh="1">刷新这一天</button></div>
    <footer data-integrity="${esc(integrity)}">${esc(integrity)}</footer>`;
  bindNav();
  postHeight();
}

function locateEvent(id) {
  const target = document.getElementById(eventDomId(id));
  if (!target) return;
  for (let p = target.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
  target.setAttribute("tabindex", "-1");
  target.focus({preventScroll: true});
  target.scrollIntoView({behavior: "smooth", block: "center"});
}

app.addEventListener("click", ev => {
  const t = ev.target.closest("[data-locate-event],[data-crossday],[data-toggle],[data-expand],[data-filter],[data-goto],[data-cat],[data-quotes],[data-refresh]");
  if (!t) return;
  if (t.dataset.locateEvent) { locateEvent(t.dataset.locateEvent); }
  else if (t.dataset.crossday !== undefined) { state.crossDay = !state.crossDay; keepScroll(); }
  else if (t.dataset.toggle) { const id = t.dataset.toggle; state.open.has(id) ? state.open.delete(id) : state.open.add(id); store.set(openKey(state.date), [...state.open].slice(-200)); keepScroll(); }
  else if (t.dataset.cat) { state.cat = state.cat === t.dataset.cat ? "" : t.dataset.cat; keepScroll(); }
  else if (t.dataset.quotes) { state.quotes = !state.quotes; store.set("ll.v2.quotes", state.quotes); keepScroll(); }
  else if (t.dataset.refresh) { load(); }
  else if (t.dataset.expand) {
    // 媒体折叠行可以再收回去；其他“再显示”只展开。
    if (t.dataset.expand.endsWith("-noise") && state.expanded.has(t.dataset.expand)) state.expanded.delete(t.dataset.expand);
    else state.expanded.add(t.dataset.expand);
    keepScroll();
  }
  else if (t.dataset.filter) { state.filter = t.dataset.filter; state.cat = ""; keepScroll(); }
  else if (t.dataset.goto) {
    const m = +t.dataset.goto;
    const hStart = Math.floor(m / 60) * 60;
    let el = [...app.querySelectorAll(".hour")].find(s => +s.dataset.start === hStart);
    if (!el && state.filter !== "all") {
      state.filter = "all";
      state.cat = "";
      render();
      el = [...app.querySelectorAll(".hour")].find(s => +s.dataset.start === hStart);
    }
    if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && state.open.size) { state.open.clear(); store.set(openKey(state.date), []); keepScroll(); }
});
// 只有今天的数据还在变，隐藏时不轮询。
setInterval(() => { if (!document.hidden && state.date === shToday() && state.data) load(true); }, 60000);
function keepScroll() { if (!state.data) return; const y = window.scrollY; render(); window.scrollTo(0, y); }
load();
</script>
</body>
</html>
